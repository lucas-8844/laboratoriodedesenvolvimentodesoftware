<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Moeda Estudantil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Sistema de Moeda Estudantil</h1>
    
    <div class="formulario">
      <h2>Cadastro de Aluno</h2>
      <form id="form-aluno">
        <input type="text" id="nome" placeholder="Nome do Aluno" required>
        <input type="email" id="email" placeholder="Email do Aluno" required>
        <button type="submit">Cadastrar</button>
      </form>
    </div>

    <div class="alunos">
      <h2>Alunos Cadastrados</h2>
      <ul id="lista-alunos"></ul>
    </div>

    <div class="empresas">
      <h2>Empresas Parceiras</h2>
      <ul id="lista-empresas"></ul>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
