<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
</head>
<body>
    <h1>Cadastro de Aluno</h1>

    <input type="text" id="nome" placeholder="Nome"><br>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="text" id="cpf" placeholder="CPF"><br>
    <input type="text" id="rg" placeholder="RG"><br>
    <input type="text" id="endereco" placeholder="Endereço"><br>
    <input type="text" id="instituicao" placeholder="Instituição"><br>
    <input type="text" id="curso" placeholder="Curso"><br>
    <button onclick="cadastrarAluno()">Cadastrar</button>

    <h2>Alunos Cadastrados</h2>
    <ul id="listaAlunos"></ul>

    <script>
        const API_URL = "http://localhost:8080/alunos";

        function cadastrarAluno() {
            const aluno = {
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                cpf: document.getElementById("cpf").value,
                rg: document.getElementById("rg").value,
                endereco: document.getElementById("endereco").value,
                instituicao: document.getElementById("instituicao").value,
                curso: document.getElementById("curso").value
            };

            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(aluno)
            }).then(() => {
                alert("Aluno cadastrado!");
                listarAlunos();
            });
        }

        function listarAlunos() {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    const lista = document.getElementById("listaAlunos");
                    lista.innerHTML = "";
                    data.forEach(aluno => {
                        const item = document.createElement("li");
                        item.textContent = ${aluno.nome} - ${aluno.email};
                        lista.appendChild(item);
                    });
                });
        }

        listarAlunos();
    </script>
</body>
</html>
