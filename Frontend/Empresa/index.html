<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Empresa Parceira</title>
</head>
<body>
    <h1>Empresa Parceira</h1>
    <input type="text" id="empresaNome" placeholder="Nome da Empresa">
    <button onclick="cadastrarEmpresa()">Cadastrar</button>
    <h2>Empresas Cadastradas</h2>
    <ul id="listaEmpresas"></ul>

    <script>
        const API_URL = "http://localhost:8080/empresas";

        function cadastrarEmpresa() {
            const nome = document.getElementById("empresaNome").value;
            fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(nome)
            }).then(() => listarEmpresas());
        }

        function listarEmpresas() {
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    const lista = document.getElementById("listaEmpresas");
                    lista.innerHTML = "";
                    data.forEach(nome => {
                        const item = document.createElement("li");
                        item.textContent = nome;
                        lista.appendChild(item);
                    });
                });
        }

        listarEmpresas();
    </script>
</body>
</html>
